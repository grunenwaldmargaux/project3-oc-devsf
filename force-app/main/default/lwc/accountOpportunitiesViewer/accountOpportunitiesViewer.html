<template>
    <lightning-card title="Opportunités du Compte" icon-name="standard:opportunity">
        <div class="slds-p-around_medium">

            <!-- Message d'erreur dynamique -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_large">
                    <span class="slds-assistive-text">Erreur</span>
                    <h2>{error}</h2> <!-- Affichage dynamique de l'erreur -->
                </div>
            </template>

            <!-- Tableau des opportunités -->
            <template if:true={opportunities}>
                <lightning-datatable 
                    data={opportunities}
                    columns={columns}
                    key-field="Id"
                    class="slds-theme_default slds-m-top_large">
                </lightning-datatable>
            </template>

            <!-- Bouton Rafraîchir (toujours affiché) -->
            <div class="slds-text-align_right slds-m-top_large">
                <lightning-button 
                    label="Rafraîchir" 
                    onclick={handleRafraichir} 
                    variant="brand">
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
